name: Add real sausage photos

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/materialize-jpegs.yml"

permissions:
  contents: write

jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download real Pexels JPEGs and commit
        run: |
          set -euxo pipefail
          mkdir -p images
          curl -fL --retry 5 --retry-all-errors -A "Mozilla/5.0" \
            -o images/slice.jpg \
            "https://wsrv.nl/?url=images.pexels.com/photos/5627444/pexels-photo-5627444.jpeg&w=1600&output=jpg"
          curl -fL --retry 5 --retry-all-errors -A "Mozilla/5.0" \
            -o images/board.jpg \
            "https://wsrv.nl/?url=images.pexels.com/photos/5627443/pexels-photo-5627443.jpeg&w=1600&output=jpg"
          ls -l images/slice.jpg images/board.jpg
          python3 -c "from pathlib import Path;\n[print(n, Path('images/'+n+'.jpg').stat().st_size, Path('images/'+n+'.jpg').read_bytes()[:3]) or (_ for _ in ()).throw(Exception(n)) if Path('images/'+n+'.jpg').read_bytes()[:3]!=bytes([255,216,255]) else None for n in ['slice','board']]"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/slice.jpg images/board.jpg
          if git diff --cached --quiet; then
            echo no jpeg changes
            exit 0
          fi
          git commit -m "Add real sausage photos"
          git push
