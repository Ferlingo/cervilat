name: Add real sausage photos

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/materialize-jpegs.yml"

permissions:
  contents: write
  issues: write

jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download real Pexels JPEGs
        run: |
          set -x
          mkdir -p images
          echo start > /tmp/report.txt
          curl -sS -L -A Mozilla/5.0 -w "slice_pexels %{http_code} %{size_download}\n" -o images/slice.jpg "https://images.pexels.com/photos/5627444/pexels-photo-5627444.jpeg?auto=compress&cs=tinysrgb&w=1600" >> /tmp/report.txt 2>&1 || echo pexels_slice_fail >> /tmp/report.txt
          curl -sS -L -A Mozilla/5.0 -w "board_pexels %{http_code} %{size_download}\n" -o images/board.jpg "https://images.pexels.com/photos/5627443/pexels-photo-5627443.jpeg?auto=compress&cs=tinysrgb&w=1600" >> /tmp/report.txt 2>&1 || echo pexels_board_fail >> /tmp/report.txt
          curl -sS -L -A Mozilla/5.0 -w "slice_wsrv %{http_code} %{size_download}\n" -o images/slice2.jpg "https://wsrv.nl/?url=images.pexels.com/photos/5627444/pexels-photo-5627444.jpeg&w=1600&output=jpg" >> /tmp/report.txt 2>&1 || echo wsrv_slice_fail >> /tmp/report.txt
          ls -l images >> /tmp/report.txt 2>&1 || true
          python3 -c "from pathlib import Path; import os; print('files', os.listdir('images'));\n[print(p, p.stat().st_size, p.read_bytes()[:4]) for p in Path('images').glob('*')]" >> /tmp/report.txt 2>&1 || echo pyfail >> /tmp/report.txt
          cat /tmp/report.txt
          gh issue create --title "jpeg-download-debug" --body-file /tmp/report.txt
          python3 -c "from pathlib import Path; b=Path('images/slice.jpg').read_bytes(); assert b[:3]==bytes([255,216,255]); b=Path('images/board.jpg').read_bytes(); assert b[:3]==bytes([255,216,255])"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/slice.jpg images/board.jpg
          git commit -m "Add real sausage photos"
          git push
