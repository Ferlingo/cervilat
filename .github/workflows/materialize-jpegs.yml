name: Add real sausage photos

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/materialize-jpegs.yml"

permissions:
  contents: write

jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download real Pexels JPEGs and commit
        run: |
          set -euo pipefail
          mkdir -p images
          curl -fsSL -A "Mozilla/5.0" -L -o images/slice.jpg "https://images.pexels.com/photos/5627444/pexels-photo-5627444.jpeg?auto=compress&cs=tinysrgb&w=1600"
          curl -fsSL -A "Mozilla/5.0" -L -o images/board.jpg "https://images.pexels.com/photos/5627443/pexels-photo-5627443.jpeg?auto=compress&cs=tinysrgb&w=1600"
          python3 -c "from pathlib import Path\nfor n in ['slice','board']:\n b=(Path('images')/(n+'.jpg')).read_bytes()\n assert b[:3]==bytes([255,216,255]), n\n print(n, 'ok', len(b))"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/slice.jpg images/board.jpg
          if git diff --cached --quiet; then
            echo no jpeg changes
            exit 0
          fi
          git commit -m "Add real sausage photos"
          git push
