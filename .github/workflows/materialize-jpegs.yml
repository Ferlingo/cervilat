name: Add real sausage photos

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/materialize-jpegs.yml"

permissions:
  contents: write

jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add spices JPEG and remove debug report
        run: |
          mkdir -p images
          curl -L -A Mozilla/5.0 -o images/spices.jpg https://images.pexels.com/photos/678414/pexels-photo-678414.jpeg
          python3 -c "from pathlib import Path; b=Path('images/spices.jpg').read_bytes(); print('spices', len(b), b[:4]); assert b[:3]==bytes([255,216,255])"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add images/spices.jpg
          if [ -f report.txt ]; then git rm -f report.txt; fi
          git commit -m "Add real spices photo and drop debug report"
          git push
